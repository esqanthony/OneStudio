name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir dist
